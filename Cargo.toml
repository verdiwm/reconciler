[package]
name = "reconciler"
version = "0.0.3"
edition = "2024"
license = "Apache-2.0"
authors = ["Matilde Morrone <contact@morrone.dev>"]
description = "Simple and composable async event listener"
readme = "README.md"
documentation = "https://docs.rs/reconciler"
repository = "https://github.com/verdiwm/reconciler"
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = [
    "sink",
] }
pin-project-lite = "0.2.16"
tokio = { version = "1.44.1", features = ["rt", "sync"] }
tokio-stream = { version = "0.1.17", default-features = false, features = [
    "sync",
] }
tokio-util = "0.7.14"
